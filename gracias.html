<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¡Pago aprobado! — Sombra Community</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#080D18; --night-2:#0E1526; --river-teal:#24B6A6; --dawn-amber:#FF8A3D;
    --dawn-coral:#FF5D7A; --ink-0:#EDEFF6; --ink-1:#A9B1C6; --line:rgba(237,239,246,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(90% 60% at 50% 0%, rgba(36,182,166,0.14) 0%, transparent 55%), var(--night);
    font-family:'Inter',sans-serif; color:var(--ink-0); padding:24px;
  }
  .card{
    max-width:440px; text-align:center; background:var(--night-2);
    border:1px solid var(--line); border-radius:18px; padding:44px 32px;
  }
  .icon{
    width:64px; height:64px; margin:0 auto 22px; border-radius:50%;
    background:rgba(36,182,166,0.14); display:flex; align-items:center; justify-content:center;
  }
  h1{ font-family:'Rajdhani',sans-serif; font-size:30px; font-weight:700; }
  p{ margin-top:12px; font-size:15px; color:var(--ink-1); line-height:1.6; }
  a.btn{
    display:inline-flex; margin-top:26px; padding:13px 26px; border-radius:999px;
    background:linear-gradient(100deg, var(--dawn-amber), var(--dawn-coral));
    color:#100804; font-weight:600; text-decoration:none; font-size:14.5px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#24B6A6" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>¡Pago aprobado!</h1>
    <p>Gracias por tu compra en Sombra Community. Escríbenos por WhatsApp y te ayudamos enseguida.</p>
    <a href="/" class="btn">Volver a la tienda</a>
  </div>
</body>
</html>
